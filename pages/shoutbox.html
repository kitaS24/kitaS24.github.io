<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHOUTBOX</title>
    <link rel="stylesheet" type="text/css" href="PageStyle.css">
    <style>
        #1{
            border-radius: 0px;
            border: 0px none #0000;
        }
        #rules{
            background-color:#335;
            position: absolute;
            right:4px;
            top: calc(50% - 150px);
            height:150px;
            width:140px;
            color:#fff;
        }

        #ch-div{
            position: absolute;
            right:4px;
            top: calc(50% + 10px);

        }
        #checkboxes{
            width: calc(8 * 15px);
        }

        #rules li{
            color:#fff;
        }

        .ch-ch{
            width:17px;
            height: 15px;
            margin-top: 0px;margin-right: 0px;margin-bottom: 0px;margin-left: 0px;
        }
        td, th{
            width:15px;
            height: 15px;
            border: 0px;
            background-color: #000;
            padding: 0px;
        }

        #ch-upd{
            font-size: 12px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://iframe.chat/scripts/main.min.js"></script>
    <script>
    window.addEventListener("load", function(){

        /*
        chattable.commands = {
            "test" : function(){
                alert("!test works.");
            }
        };*/

        let WantSync = true;
        setTimeout(function (){WantSync = false;},2500);
        chattable.on("payload", function(data) {
            switch(data.type) {
                case "UpdateCh":
                    LoadCheckboxes(data.data);
                    $("#ch-upd").html("updated by:<br>"+data.updatedby);
                    break;
                case "GetCh":
                    if(WantSync){break;}
                    console.log("data b");
                    SendCheckboxes("SetNewCh");
                    //this is the worst way to do that. this scaled pretty bad
                    break;
                case "SetNewCh":
                    console.log("data a");
                    console.log(data);
                    if(!WantSync){break;}
                    LoadCheckboxes(data.data,true);
                    WantSync = false;
                    break;
                default:
                    break;
            }


        });


        chattable.initialize({
            stylesheet: "chattable.css"
        }).then(function(){
            chattable.sendPayload({
                type: "GetCh"
            });
            ResetCheckboxes();
        });
        //CUSTOM STUFF



    function GenCheckboxes(w,h){
        for (let j=0;j<h;j++){
            $("#checkboxes").append("<tr class='ch-row'></tr>");
        }

        for (let i=0;i<w;i++){
            $(".ch-row").append("<td class='ch-cell'></td>");
        }

        $(".ch-cell").html("<input type='checkbox' class='ch-ch'>")

        $(".ch-ch").click(function (){
            if(!WantSync) {
                SendCheckboxes("UpdateCh");
            }
        });
    }



    GenCheckboxes(8,8);
    });

    let ChDim = 8;

    function SendCheckboxes(msgType) {
        let out = "";
        $(".ch-ch").each(function () {
            if($(this).prop('checked')){
                out +="1";
            }else{
                out+="0";
            }
        });
        let n = chattable.user.name;
        chattable.sendPayload({
            type: msgType,
            updatedby: n,
            data: out

        });
    }

    function LoadCheckboxes(a, or){
        if(a.length != ChDim*ChDim){return;}

        $(".ch-ch").each(function (i) {
            if(or){
                $(this).prop('checked', a[i]=='1' || $(this).prop('checked'));
            }else{
                $(this).prop('checked', a[i]=='1');
            }

        });
    }
    function ResetCheckboxes(){
        $(".ch-ch").each(function (i) {
            $(this).prop('checked', false);
        });
    }

</script>
</head>
<body>
    <iframe id="chattable" frameBorder="0" src="https://iframe.chat/embed?chat=34352610" height="575px" width="500px"></iframe>

    <div id="ch-div">
    <table id="checkboxes">
    </table>
    <p id="ch-upd">updated by:<br></p>
    </div>

<div id="rules">
    Rules:<br>
    <ul>
    <li><strong>Be Nice</strong></li>
        <li><strong>Avoid politics</strong></li>
        <li><strong>English Only</strong></li>
        <li><strong>Keep it PG13</strong></li>
    </ul>
</div>

</body>
</html>
